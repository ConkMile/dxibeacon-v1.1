    repositories {
        google()
        mavenCentral()
        // 本地 aar 目录：app/libs/ibeaconsdk-release.aar
        flatDir {
            dirs 'app/libs'
        }
    }
}
rootProject.name = "DXibeaconSDK_Demo"
include ':app'
